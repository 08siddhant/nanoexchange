# Reverse proxy in front of the exchange.
# WebSockets need the Upgrade/Connection headers forwarded and long timeouts,
# otherwise Nginx closes idle market-data connections after 60s.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream exchange {
    server exchange:8080;
}

server {
    listen 80;

    location /ws {
        proxy_pass http://exchange;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Metrics are for Prometheus only, not for the public internet.
    location /metrics {
        deny all;
    }

    location / {
        proxy_pass http://exchange;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
