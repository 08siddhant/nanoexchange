# Full local stack:
#   http://localhost        -> exchange UI via Nginx (WebSocket proxied)
#   http://localhost:8080   -> exchange directly
#   http://localhost:9090   -> Prometheus
#   http://localhost:3000   -> Grafana (dashboard "nanoexchange" is pre-loaded)
services:
  exchange:
    build: .
    image: nanoexchange:latest
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_DIR: /data
      BOTS: "1"
      THREADS: "2"
    ports:
      - "8080:8080"
    volumes:
      - nxdata:/data        # WAL + snapshots survive container restarts
    stop_grace_period: 10s  # SIGTERM -> graceful drain

  nginx:
    image: nginx:1.27-alpine
    depends_on: [exchange]
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  prometheus:
    image: prom/prometheus:v2.54.1
    depends_on: [exchange]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    depends_on: [prometheus]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nanoexchange.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  nxdata:
